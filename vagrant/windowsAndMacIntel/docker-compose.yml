services:
  vprodb:
    build:
      context: ./Docker-files/db
    image: sriram084/vprofiledb
    container_name: vprodb
    ports:
      - "3306:3306"
    volumes:
      - vprodbdata:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=vprofiledb

  vprocache01:
    build:
      context: ./Docker-files/mc
    image: sriram084/vprofilemc
    container_name: vpromc
    ports:
      - "11211:11211"

  vpromq01:
    build:
      context: ./Docker-files/rmq
    image: sriram084/vprofilermq
    container_name: vprormq
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  vproapp:
    build:
      context: ./Docker-files/app
    image: sriram084/vprofileapp
    container_name: vproapp
    ports:
      - "8080:8080"
    volumes:
      - vproappdata:/usr/local/tomcat/webapps

  vproweb:
    build:
      context: ./Docker-files/web
    image: sriram084/vprofileweb
    container_name: vproweb
    ports:
      - "80:80"

volumes:
  vprodbdata: {}
  vproappdata: {}
